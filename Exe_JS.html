<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - ARRAY</title>
</head>
<body>
<h1>Usando Estrutura de dados Array com Repetição for</h1>


<script>
let nomes = new Array("Laura","Rita","Patrícia","Rodrigo","Manuel","Gabriel","ricardo");

let cont;
for(cont =0; cont < nomes.length; cont++){
  let aluno =  nomes[cont]; //aqui tenho Laura pela 1 vez
if((aluno.charAt(2) == "R") || (aluno.charAt(2) == "r"))
{
  document.write("O aluno" + aluno + "começa com a letra R ou r <br>");
}
}




</script>




</body>
</html>
